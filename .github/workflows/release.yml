name: Preview release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  release:
    name: Build and publish unsigned preview
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.203

      - name: Read release version
        shell: bash
        run: |
          release_version=${GITHUB_REF_NAME#v}
          bundle_version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" packaging/macos/Info.plist)
          if [[ "$release_version" != "${bundle_version}-preview."* ]]; then
            echo "Preview tag ${GITHUB_REF_NAME} must begin with v${bundle_version}-preview." >&2
            exit 1
          fi
          echo "CLIPJOB_RELEASE_VERSION=${release_version}" >> "$GITHUB_ENV"

      - name: Build and verify self-contained app
        run: |
          ./scripts/build-macos-app.sh
          codesign --verify --deep --strict artifacts/macos/ClipJob.app
          archive="artifacts/macos/ClipJob-${CLIPJOB_RELEASE_VERSION}-macos-arm64.zip"
          ditto -c -k --keepParent artifacts/macos/ClipJob.app "$archive"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "artifacts/macos/ClipJob-${CLIPJOB_RELEASE_VERSION}-macos-arm64.zip" \
            --title "ClipJob ${CLIPJOB_RELEASE_VERSION}" \
            --notes-file "docs/releases/v${CLIPJOB_RELEASE_VERSION}.md" \
            --prerelease \
            --verify-tag
